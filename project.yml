name: HapTick
options:
  bundleIdPrefix: ad.neko
  createIntermediateGroups: true
  knownRegions: [en, zh-Hans, zh-Hant, ja, fr, es]
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "28"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
fileGroups:
  - Docs
  - Config
targets:
  HapTick:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HapTick iOS App
      - path: Shared
    dependencies:
      - target: HapTick Watch App
        embed: true
      - sdk: WatchConnectivity.framework
      - sdk: CoreHaptics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HAPTICK_BUNDLE_ID)
        INFOPLIST_FILE: HapTick iOS App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  HapTick Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HapTick Watch App
      - path: Shared
    dependencies:
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HAPTICK_BUNDLE_ID).watchapp
        INFOPLIST_FILE: HapTick Watch App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(HAPTICK_BUNDLE_ID)
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
schemes:
  HapTick:
    build:
      targets:
        HapTick: all
        HapTick Watch App: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  HapTick Watch App:
    build:
      targets:
        HapTick Watch App: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
