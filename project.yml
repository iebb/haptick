name: HapTick
options:
  bundleIdPrefix: ad.neko
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HapTick Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HapTick Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.haptick.watchapp
        INFOPLIST_FILE: HapTick Watch App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9733K94JUG
        SKIP_INSTALL: NO
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
schemes:
  HapTick Watch App:
    build:
      targets:
        HapTick Watch App: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
